spring.application.name=portal-api
spring.datasource.url=jdbc:postgresql://localhost:5432/ticket_dashboard
spring.datasource.username=ticket_app
spring.datasource.password=${DB_APP_PASSWORD}

spring.flyway.url=${spring.datasource.url}
spring.flyway.user=ticket_migrator
spring.flyway.password=${DB_MIGRATION_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
server.servlet.session.cookie.same-site=lax
logging.level.org.springframework.security=DEBUG